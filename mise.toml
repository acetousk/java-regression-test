[tools]
java = "temurin-21.0.12+101.0.LTS"
python = "3.14"
# Change 1: Current Rust framework dependencies require Rust 1.98 or newer.
rust = "1.98.0"

# Gradle is supplied by moqui-framework/gradlew; Python uses only the stdlib.
[tasks.build]
description = "Initialize, build, and compare both engines after empty-database boot"
dir = "{{config_root}}"
run = "python java-regression-test.py"

[tasks.test]
description = "Run controller unit tests without building the engines"
dir = "{{config_root}}"
run = "python -m unittest discover -s test -v"
